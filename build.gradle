plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = 'org.nivpisum.bettermapatlases'
version = '1.0.1'
base { archivesName = 'better_map_atlases-1.20.1-forge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }
mixin {
    add sourceSets.main, 'better_map_atlases.refmap.json'
    config 'better_map_atlases.mixins.json'
    config 'better_map_atlases.dynamic_atlas.mixins.json'
    config 'better_map_atlases.cartography.mixins.json'
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    // Reproducible compile/test baseline; these are not installation version restrictions.
    compileOnly fg.deobf('maven.modrinth:twkfQtEc:W0ZWjZib') { transitive = false } // Moonlight 1.20-2.16.35-forge
    compileOnly fg.deobf('maven.modrinth:4hwXMFif:Zcz2vXIl') { transitive = false } // Map Atlases 1.20-6.0.20
}
dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
// Mixin AP writes side outputs outside classes/. Gradle incremental compilation
// can discard those without reprocessing the unchanged mixin source files.
tasks.named('compileJava', JavaCompile) {
    options.incremental = false
    outputs.files(
        layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'),
        layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
}
tasks.named('jar') {
    from('LICENSE')
    from('NOTICE.md')
    from('LICENSES') { into 'LICENSES' }
    manifest { attributes 'MixinConfigs': 'better_map_atlases.mixins.json,better_map_atlases.dynamic_atlas.mixins.json,better_map_atlases.cartography.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.named('test') { useJUnitPlatform() }

tasks.register('verifyReleaseJar') {
    dependsOn 'reobfJar'
    doLast {
        def archive = new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile)
        try {
            def readJson = { String name ->
                def entry = archive.getEntry(name)
                if (entry == null) throw new GradleException("Release JAR is missing ${name}")
                new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
            }
            def config = readJson('better_map_atlases.mixins.json')
            if (config.refmap != 'better_map_atlases.refmap.json') throw new GradleException('Missing Mixin refmap reference')
            def dynamic = readJson('better_map_atlases.dynamic_atlas.mixins.json')
            if (dynamic.plugin != 'org.nivpisum.bettermapatlases.dynamic.SurveyAtlasMixinPlugin' || dynamic.refmap != config.refmap)
                throw new GradleException('Dynamic Atlas integration is missing its gate or refmap')
            def cartographyConfig = readJson('better_map_atlases.cartography.mixins.json')
            [config, dynamic, cartographyConfig].each { mixinConfig ->
                ((mixinConfig.mixins ?: []) + (mixinConfig.client ?: [])).each { mixinName ->
                    def className = (mixinConfig.package + '.' + mixinName).replace('.', '/') + '.class'
                    if (archive.getEntry(className) == null) throw new GradleException("Missing Mixin class: ${className}")
                }
            }
            def manifest = new java.util.jar.Manifest(archive.getInputStream(archive.getEntry('META-INF/MANIFEST.MF')))
            def mixinConfigs = manifest.mainAttributes.getValue('MixinConfigs')?.split(',')?.toList()?.toSet()
            if (mixinConfigs != ['better_map_atlases.mixins.json', 'better_map_atlases.dynamic_atlas.mixins.json', 'better_map_atlases.cartography.mixins.json'].toSet())
                throw new GradleException('Release manifest does not activate all Mixin configurations')
            if (archive.entries().toList().any { entry ->
                ['pepjebs/', 'net/mehvahdjukaar/', 'com/llamalad7/'].any { entry.name.startsWith(it) }
            }) throw new GradleException('An optional dependency was accidentally bundled')
            def refmap = readJson(config.refmap)
            def expected = [
                'org/nivpisum/bettermapatlases/dynamic/mixin/SurveyKindPacketMixin': [
                    'getUpdatePacket': 'm_164796_'],
                'org/nivpisum/bettermapatlases/dynamic/mixin/client/AtlasDynamicLabelMixin': [
                    'renderWidget': 'm_87963_'],
                'org/nivpisum/bettermapatlases/dynamic/mixin/client/AtlasDynamicItemLabelMixin': [
                    'appendHoverText': 'm_7373_',
                    'Lnet/minecraft/network/chat/Component;translatable(Ljava/lang/String;[Ljava/lang/Object;)Lnet/minecraft/network/chat/MutableComponent;': 'm_237110_'],
                'org/nivpisum/bettermapatlases/dynamic/mixin/client/AtlasDynamicCartographyLabelMixin': [
                    'renderWidget': 'm_87963_',
                    'Lnet/minecraft/network/chat/Component;translatable(Ljava/lang/String;[Ljava/lang/Object;)Lnet/minecraft/network/chat/MutableComponent;': 'm_237110_'],
                'org/nivpisum/bettermapatlases/dynamic/mixin/client/AtlasDynamicMapWidgetMixin': [
                    'mouseClicked': 'm_6375_'],
                'org/nivpisum/bettermapatlases/dynamic/mixin/client/AtlasDynamicHistoryMixin': [
                    'init': 'm_7856_', 'tick': 'm_86600_'],
                'org/nivpisum/bettermapatlases/mixin/SurveySavedDataMixin': [
                    'load': 'm_164807_', 'save': 'm_7176_', 'locked': 'm_164775_', 'scaled': 'm_164787_'],
                'org/nivpisum/bettermapatlases/mixin/MapItemMixin': [
                    'update': 'm_42893_',
                    'Lnet/minecraft/world/level/saveddata/maps/MapItemSavedData;updateColor(IIB)Z': 'm_164792_'],
                'org/nivpisum/bettermapatlases/mixin/MapSavedDataMixin': [
                    'load': 'm_164807_', 'save': 'm_7176_', 'locked': 'm_164775_',
                    'setColor': 'm_164803_', 'getUpdatePacket': 'm_164796_'],
                'org/nivpisum/bettermapatlases/mixin/client/MapInstanceMixin': [
                    'draw': 'm_93291_', 'updateTexture': 'm_93290_',
                    'Lnet/minecraft/client/renderer/texture/DynamicTexture;upload()V': 'm_117985_']
            ]
            expected.each { mixinClass, methods ->
                methods.each { name, srg ->
                    if (!refmap.mappings[mixinClass]?.get(name)?.contains(srg))
                        throw new GradleException("Missing release mapping: ${mixinClass}.${name}")
                }
            }
            def classEntry = archive.getEntry('org/nivpisum/bettermapatlases/mixin/client/MapInstanceMixin.class')
            def constantPool = new String(archive.getInputStream(classEntry).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            ['f_93280_', 'f_182565_'].each { field ->
                if (!constantPool.contains(field)) throw new GradleException("Unmapped release @Shadow field: ${field}")
            }
            [
                'AtlasDynamicMapTypeMixin': ['getHeight', 'createNewMapItem', 'createExistingMapItem', 'getDiscoveryReach', 'markDynamic'],
                'AtlasDynamicServerMixin': ['onPlayerTick', 'getSelectedSlice', 'maybeCreateNewMapEntry', 'canCreateDynamic'],
                'AtlasDynamicHolderMixin': ['updateMap', 'updateMarkers', 'org/nivpisum/bettermapatlases/dynamic/SurveyRecorder', 'f_77960_'],
                'AtlasDynamicGuiSyncMixin': ['syncAndOpenGui', 'requestKindSync'],
                'SurveyKindPacketMixin': ['synchronizeKind', 'includeKindInPacket'],
                'client/AtlasDynamicClientMixin': ['maybeChangeSlice', 'getClosestSlice', 'isFinite'],
                'client/AtlasDynamicHistoryMixin': ['showHistory', 'followPlayer', 'clampBlockY', 'm_7861_']
            ].each { mixinName, names ->
                def entry = archive.getEntry("org/nivpisum/bettermapatlases/dynamic/mixin/${mixinName}.class")
                if (entry == null) throw new GradleException("Missing dynamic Atlas hook: ${mixinName}")
                def pool = new String(archive.getInputStream(entry).bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                names.each { name ->
                    if (!pool.contains(name)) throw new GradleException("Missing dynamic Atlas hook: ${mixinName}.${name}")
                }
            }
            if (readJson('pack.mcmeta').pack.pack_format != 15)
                throw new GradleException('Incorrect resource pack format')
        } finally { archive.close() }
    }
}
tasks.named('build') { dependsOn 'verifyReleaseJar' }
