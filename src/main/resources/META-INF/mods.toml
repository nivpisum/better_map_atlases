description='''Keep the places you explore in one atlas—above ground and below.

Adds observed cave maps, height browsing, texture-based colours, and a configurable atlas and minimap. Records stay with the book; unexplored terrain stays unknown. Requires Forge and Map Atlases on both client and server, without version restrictions added by this mod.

Verified combination: Minecraft 1.20.1, Forge 47.4.23, Java 17, Map Atlases 1.20-6.0.20, Moonlight 1.20-2.16.35-forge. Other combinations are untested: they may work or fail, and compatibility is yours to explore and resolve. Install libraries required by your chosen Map Atlases release.

将走过的地表与洞穴收进地图册。按高度浏览已探索的洞穴，使用更准确的地图颜色，并自由调整大小地图。仅强制 Forge 和 Map Atlases 存在，不额外限制版本；Map Atlases 所需的库按你选用的版本配齐。已验证组合见上文；其他环境可能正常或异常，请自行探索和处理。'''

