description='''Keep the places you explore in one atlas—above ground and below.

Adds observed cave maps, height browsing, texture-based colours, and a configurable full-screen atlas and minimap. Records stay with the book; unexplored terrain stays unknown. Requires Map Atlases and Moonlight on both client and server.

将走过的地表与洞穴收进地图册。按高度浏览已探索的洞穴，使用更准确的地图颜色，并自由调整大地图与小地图。记录随书保存，不揭示未探索区域。'''

